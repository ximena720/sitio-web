<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegancia Natural - Estética</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-page: #fdf8f9;
            --bg-card: #ffffff;
            --accent: #a64d68;
            --accent-hover: #8a3b53;
            --accent-soft: #f9ecf0;
            --text-main: #2d2427;
            --text-muted: #6e5f64;
            --border-color: #ead8de;
            --disabled-bg: #f1ecef;
            --disabled-text: #a4989c;
            --success-bg: #2e8b57;
            --success-hover: #246e44;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.5;
        }

        /* Encabezado y navegación */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--accent);
        }

        /* Banner principal */
        .hero-banner {
            background: linear-gradient(135deg, #6d2c42 0%, #a64d68 100%);
            color: #ffffff;
            text-align: center;
            padding: 75px 20px;
        }

        .hero-banner h1 {
            font-size: 2.3rem;
            margin-bottom: 12px;
        }

        .hero-banner p {
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto 24px auto;
            opacity: 0.95;
        }

        .btn-primary {
            display: inline-block;
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .hero-banner .btn-primary {
            background-color: #ffffff;
            color: #6d2c42;
        }

        .hero-banner .btn-primary:hover {
            background-color: #f9ecf0;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        /* Secciones generales */
        .section {
            max-width: 1100px;
            margin: 0 auto;
            padding: 55px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 1.85rem;
            color: var(--text-main);
            margin-bottom: 30px;
        }

        /* Tarjetas de servicios */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 22px;
        }

        .service-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(45, 36, 39, 0.05);
            text-align: center;
            padding-bottom: 18px;
        }

        .service-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
            margin-bottom: 14px;
        }

        .service-card h3 {
            font-size: 1.15rem;
            margin-bottom: 6px;
            padding: 0 12px;
        }

        .service-card p {
            font-size: 0.92rem;
            color: var(--text-muted);
            padding: 0 14px;
        }

        /* Contenedor de citas */
        .booking-container {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .card-box,
        .user-data {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 4px 12px rgba(45, 36, 39, 0.04);
        }

        .card-box h3,
        .user-data h3 {
            font-size: 1.15rem;
            color: var(--text-main);
        }

        /* Selección de servicios */
        .service-options {
            margin-top: 14px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
            gap: 12px;
        }

        .service-opt {
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
